[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trader"
version = "0.1.0"
description = "UK TCG arbitrage decision-support: find underpriced cards on eBay UK, value them, rank by profit-after-fees, and alert for manual purchase."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "rapidfuzz>=3.6",
    "httpx>=0.27",
    "sqlalchemy>=2.0",       # persistence layer — imported by the app at startup
    "apscheduler>=3.10",     # scheduled scans — imported by the app at startup
]

[project.optional-dependencies]
# The pure core (trader.core, trader.identify) depends on NONE of these, and
# the app boots fine without them — they add opt-in capabilities only.
dev = ["pytest>=8", "pytest-cov>=4", "ruff>=0.3", "mypy>=1.8", "respx>=0.20", "freezegun>=1.4"]
migrations = ["alembic>=1.13"]   # author/run DB migrations (the app's DB works without it)
vision = ["anthropic>=0.40"]     # Wave 3 #10: photo-based card ID (imported lazily)

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008"]  # FastAPI uses function calls in argument defaults (Depends)

[tool.mypy]
python_version = "3.11"
mypy_path = "backend"
warn_unused_ignores = true
no_implicit_optional = true

# Strict where bugs cost money; pragmatic elsewhere.
[[tool.mypy.overrides]]
module = ["trader.core.*", "trader.identify.*"]
disallow_untyped_defs = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["apscheduler.*", "anthropic", "anthropic.*"]
ignore_missing_imports = true
