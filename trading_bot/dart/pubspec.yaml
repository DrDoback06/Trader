name: trading_bot
description: Multi-agent day trading platform with real-time market scanning and automated execution
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  
  # Charts and UI - temporarily replaced for production compatibility
  # syncfusion_flutter_charts: ^24.1.41
  # syncfusion_flutter_core: ^24.1.41
  # syncfusion_flutter_datagrid: ^24.1.41
  fl_chart: ^0.62.0
  
  # Existing dependencies
  web_socket_channel: ^2.4.0
  http: ^1.1.0
  dio: ^5.3.2
  grpc: ^3.2.4
  protobuf: ^3.1.0
  postgres: ^2.6.2
  redis: ^3.1.0
  rxdart: ^0.27.7
  isolate_contactor: ^4.0.0
  envied: ^0.5.3
  logger: ^2.0.2+1
  json_annotation: ^4.8.1
  ml_linalg: ^13.12.6
  collection: ^1.18.0
  
  # Additional UI packages
  flutter_animate: ^4.3.0
  gap: ^3.0.1
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  json_serializable: ^6.7.1


flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Roboto
      fonts:
        - asset: fonts/Roboto-Regular.ttf
        - asset: fonts/Roboto-Bold.ttf
          weight: 700