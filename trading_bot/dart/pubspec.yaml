name: trading_bot
description: Multi-agent day trading platform with real-time market scanning and automated execution
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Charts
  syncfusion_flutter_charts: ^25.2.7
  flutter_riverpod: ^2.4.9
  go_router: ^14.2.7
  
  # WebSocket & HTTP
  web_socket_channel: ^2.4.0
  http: ^1.1.0
  dio: ^5.4.0
  
  # gRPC
  grpc: ^3.2.4
  protobuf: ^3.1.0
  
  # Database & Cache
  postgres: ^2.6.2
  redis: ^3.1.0
  
  # State Management & Async
  rxdart: ^0.27.7
  isolate_contactor: ^4.0.0
  
  # Configuration & Environment
  envied: ^0.5.4+1
  
  # Utilities
  intl: ^0.19.0
  uuid: ^4.2.1
  logger: ^2.0.2+1
  json_annotation: ^4.8.1
  
  # Math & Statistics
  ml_linalg: ^13.19.0
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  
  # Code Generation
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  envied_generator: ^0.5.4+1
  
  # Testing
  mockito: ^5.4.4
  test: ^1.24.9

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Roboto
      fonts:
        - asset: fonts/Roboto-Regular.ttf
        - asset: fonts/Roboto-Bold.ttf
          weight: 700