# Render Blueprint — one web service serving the API + dashboard from the Dockerfile.
# Deploy: render.com → New → Blueprint → connect this repo → pick this branch → Apply.
services:
  - type: web
    name: trader
    runtime: docker
    plan: free
    branch: claude/vibrant-faraday-HuOEu
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: EBAY_ENV
        value: production
      # Set a password to gate the whole app (recommended for a public URL).
      - key: ACCESS_PASSWORD
        sync: false
      # Set these in the Render dashboard (kept out of git). You can also enter
      # them later in the app's "Sources & Keys" page instead.
      - key: EBAY_CLIENT_ID
        sync: false
      - key: EBAY_CLIENT_SECRET
        sync: false
      - key: RAPIDAPI_KEY
        sync: false
      - key: POKEMONTCG_API_KEY
        sync: false
      # Auto-scan + Telegram alerts (Wave 1 #1). 0 = off; e.g. 10 = every 10 min.
      - key: SCAN_INTERVAL_MIN
        value: "0"
      - key: ALERT_CHANNEL
        value: console
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
